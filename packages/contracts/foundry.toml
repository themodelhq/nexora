[profile.default]
src = "src"
out = "forge-out"
libs = ["node_modules", "lib"]
test = "test/foundry"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
allow_paths = ["../../node_modules"]
fs_permissions = [{ access = "read", path = "./deployments" }]

# Fuzz settings
[fuzz]
runs = 256

# Invariant settings
[invariant]
runs = 64
depth = 32
fail_on_revert = false

[profile.coverage]
via_ir = true
