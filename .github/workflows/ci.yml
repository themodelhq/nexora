name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Manual, human-triggered deployment to Base Sepolia only. Mainnet is NEVER
  # deployed from CI. `enable_presale` defaults to false and a Base Sepolia
  # deployment must never activate the presale.
  workflow_dispatch:
    inputs:
      network:
        description: 'Target network (baseSepolia only)'
        required: true
        default: 'baseSepolia'
        type: choice
        options:
          - baseSepolia
      force_redeploy:
        description: 'Force full redeploy (dangerous; default reuse existing)'
        required: false
        default: 'false'
        type: boolean
      enable_presale:
        description: 'Enable the presale (MUST default false; requires legal review)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contracts:
    name: Contracts (compile + lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile contracts
        run: npm run compile
      - name: Lint Solidity
        run: npx solhint 'packages/contracts/src/**/*.sol'
      - name: Run contract tests
        run: npm run test:contracts
      - name: Run Foundry fuzz + invariant tests
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          export PATH="$HOME/.foundry/bin:$PATH"
          foundryup
          cd packages/contracts
          forge install foundry-rs/forge-std --no-git
          forge build
          forge test --match-path "test/foundry/*"
      - name: Static analysis (Slither) if installed
        run: |
          if command -v slither >/dev/null 2>&1; then
            slither packages/contracts/src --solc-remaps "@openzeppelin/=$(pwd)/node_modules/@openzeppelin/"
          else
            echo "Slither not installed — skipping (install with: pip install slither-analyzer)"
          fi
      - name: npm audit (contracts)
        run: npm audit --audit-level=high --omit=dev

  types-and-lint:
    name: Types + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (web)
        run: npm run typecheck -w @nexora/web
      - name: Typecheck (admin)
        run: npm run typecheck -w @nexora/admin
      - name: Typecheck (api)
        run: npm run typecheck -w @nexora/api
      - name: Build web
        run: npm run build -w @nexora/web
      - name: Build admin
        run: npm run build -w @nexora/admin

  e2e:
    name: End-to-end (web)
    runs-on: ubuntu-latest
    needs: [types-and-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: cd tests/e2e && npx playwright install --with-deps chromium
      - name: Start web app
        run: |
          npm run build -w @nexora/web
          npm run start -w @nexora/web &
          sleep 8
      - name: Run E2E tests
        run: cd tests/e2e && npx playwright test
        env:
          E2E_BASE_URL: http://localhost:3000

  # Manual workflow_dispatch deployment to Base Sepolia. Never automatic.
  deploy-sepolia:
    name: Deploy (Base Sepolia) — manual
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.network == 'baseSepolia'
    needs: [security-secrets, contracts, types-and-lint]
    environment: sepolia
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile + run contract tests
        run: |
          npm run compile
          npm run test:contracts
      - name: Deploy to Base Sepolia (idempotent; presale disabled unless enabled)
        env:
          RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.SEPOLIA_DEPLOYER_PRIVATE_KEY }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          COMMUNITY_ADDRESS: ${{ secrets.COMMUNITY_ADDRESS }}
          LIQUIDITY_ADDRESS: ${{ secrets.LIQUIDITY_ADDRESS }}
          TREASURY_ADDRESS: ${{ secrets.TREASURY_ADDRESS }}
          TREASURY_MULTISIG_ADDRESS: ${{ secrets.TREASURY_MULTISIG_ADDRESS }}
          DEVELOPMENT_ADDRESS: ${{ secrets.DEVELOPMENT_ADDRESS }}
          # Presale safety: only enable if the operator explicitly set it true,
          # and even then only for a Base Sepolia (testnet) deployment.
          ENABLE_PRESALE: ${{ github.event.inputs.enable_presale }}
          # Force redeploy only if explicitly requested.
          FORCE_REDEPLOY: ${{ github.event.inputs.force_redeploy }}
        run: npx hardhat run packages/contracts/scripts/deploy-all.ts --network baseSepolia
